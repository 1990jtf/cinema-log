<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0f">
  <meta name="description" content="浏览观影日志收藏的剧集，查找可交互的人物关系图、高清长图和文字资料。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="__SITE_CSS__">
  <script src="__SITE_SCRIPT__" defer></script>
  <title>观影日志 · Cinema Log</title>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner wrap">
      <a class="brand" href="./">
        <img src="favicon.svg" width="34" height="34" alt="">
        <span lang="en">Cinema Log</span>
        <span class="brand-subtitle">观影日志</span>
      </a>
      <nav aria-label="主导航">
        <a href="#catalog">剧集目录</a>
        <a class="jump-search" href="#catalog" aria-label="搜索剧集">
          <span class="search-icon" aria-hidden="true"></span>
          <span class="jump-search-label">搜索</span>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="sr-only">观影日志</h1>
    <section class="hero" aria-label="焦点剧集">
      <div id="spotlight-panels">
__SPOTLIGHT_PANELS__
      </div>
      <div class="hero-lower wrap">
        <dl class="stats">
          <div><dt>收录剧集</dt><dd>__STAT_SHOWS__</dd></div>
          <div><dt>剧中人物</dt><dd>__STAT_CHARS__</dd></div>
          <div><dt>年份跨度</dt><dd>__STAT_SPAN__</dd></div>
        </dl>
        <div class="spotlight" id="spotlight-picker" hidden>
          <p id="spotlight-label">切换焦点剧集</p>
          <div class="spotlight-picker" role="group" aria-labelledby="spotlight-label">
__SPOTLIGHT_BUTTONS__
          </div>
        </div>
      </div>
    </section>

    <section class="catalog wrap" id="catalog" aria-labelledby="catalog-title">
      <header class="catalog-heading">
        <h2 id="catalog-title">剧集目录</h2>
        <p class="results" id="results" role="status">共 __STAT_SHOWS__ 部剧集</p>
      </header>

      <div class="catalog-controls">
        <form class="toolbar" id="filters" aria-label="筛选剧集" hidden>
          <label class="search">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="q" name="q" type="search" placeholder="搜索中文或英文剧名" aria-label="搜索剧名" autocomplete="off">
          </label>
          <select name="platform" aria-label="播出平台">
            <option value="">全部平台</option>
__PLATFORM_OPTIONS__
          </select>
          <select name="genre" aria-label="剧集类型">
            <option value="">全部类型</option>
__GENRE_OPTIONS__
          </select>
          <select name="status" aria-label="追更状态">
            <option value="">全部状态</option>
__STATUS_OPTIONS__
          </select>
        </form>
        <label class="layout" id="layout" hidden>
          <span class="layout-icon" aria-hidden="true"></span>
          <span class="sr-only">每行列数</span>
          <select id="columns">
            <option value="auto">自动列数</option>
            <option value="2">2 列</option>
            <option value="3">3 列</option>
            <option value="4">4 列</option>
            <option value="5">5 列</option>
          </select>
        </label>
      </div>

      <div class="grid" id="grid">
__CARDS__
      </div>
      <div class="empty" id="empty" hidden>
        <p>没有找到符合条件的剧集。</p>
        <button id="reset" type="button">清除搜索和筛选</button>
      </div>
    </section>
  </main>

  <footer class="footer wrap">
    <p>豆瓣评分取自各剧第一季</p>
    <a href="https://github.com/1990jtf/cinema-log">GitHub <span aria-hidden="true">↗</span></a>
  </footer>
</body>
</html>
